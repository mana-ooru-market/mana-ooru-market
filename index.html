<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mana Ooru Market</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f9f9f9; }
    header { text-align: center; padding: 20px; background: #1b365d; color: white; }
    .cart-btn { padding: 8px 16px; cursor: pointer; background: #fff; color: #1b365d; border: none; border-radius: 5px; font-weight: bold; }
    .products-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; padding: 20px; }
    .card { border: 1px solid #ddd; padding: 15px; border-radius: 10px; text-align: center; width: 220px; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
    .btn { background: #2e7d32; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
    .btn:hover { background: #1b5e20; }
  </style>
</head>
<body>

<header>
  <h1>మా ఊరి మార్కెట్</h1>
  <button class="cart-btn" onclick="showCart()">
    🛒 Cart (<span id="cartCount">0</span>)
  </button>
</header>

<h2 style="text-align:center; margin-top:20px;">మా ఉత్పత్తులు (Our Products)</h2>

<div class="products-container">
  
  <div class="card">
    <img src="https://via.placeholder.com/150" alt="మామిడి పచ్చడి">
    <h3>మామిడి పచ్చడి</h3>
    <p>ధర: ₹180</p>
    <button class="btn" onclick="addToCart('మామిడి పచ్చడి')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/150" alt="మామిడి తాండ్ర">
    <h3>మామిడి తాండ్ర</h3>
    <p>ధర: ₹200</p>
    <button class="btn" onclick="addToCart('మామిడి తాండ్ర')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/150" alt="స్వచ్ఛమైన పసుపు">
    <h3>స్వచ్ఛమైన పసుపు</h3>
    <p>ధర: ₹150</p>
    <button class="btn" onclick="addToCart('స్వచ్ఛమైన పసుపు')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/150" alt="హోమ్‌మేడ్ హల్వా">
    <h3>హోమ్‌మేడ్ హల్వా</h3>
    <p>ధర: ₹220</p>
    <button class="btn" onclick="addToCart('హోమ్‌మేడ్ హల్వా')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/150" alt="తాజా మామిడిపండ్లు">
    <h3>తాజా మామిడిపండ్లు</h3>
    <p>ధర: ₹120</p>
    <button class="btn" onclick="addToCart('తాజా మామిడిపండ్లు')">Add to Cart</button>
  </div>

</div>

<script>
  const prices = {
    "మామిడి పచ్చడి": 180,
    "మామిడి తాండ్ర": 200,
    "స్వచ్ఛమైన పసుపు": 150,
    "హోమ్‌మేడ్ హల్వా": 220,
    "తాజా మామిడిపండ్లు": 120
  };
  
  let cart = [];

  function addToCart(product) {
    let item = cart.find(i => i.name === product);
    if (item) {
      item.qty += 1;
    } else {
      cart.push({ name: product, price: prices[product], qty: 1 });
    }
    updateCartCount();
    alert(product + " కార్ట్‌లో యాడ్ అయింది!");
  }

  function updateCartCount() {
    let totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
    document.getElementById('cartCount').textContent = totalCount;
  }

  function showCart() {
    if (cart.length === 0) {
      alert("మీ కార్ట్ ఖాళీగా ఉంది!");
      return;
    }
    let msg = "🛒 మీ కార్ట్ వివరాలు:\n\n";
    let total = 0;
    cart.forEach((item, index) => {
      let itemTotal = item.price * item.qty;
      total += itemTotal;
      msg += `${index + 1}. ${item.name} x ${item.qty} = ₹${itemTotal}\n`;
    });
    msg += `\nమొత్తం ధర: ₹${total}`;
    alert(msg);
  }
</script>

</body>
</html>
