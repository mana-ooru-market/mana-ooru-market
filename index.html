<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>మన ఊరి మార్కెట్</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f9f9f9; }
    
    header { 
      background: #1b365d; 
      color: white; 
      padding: 10px 15px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      position: relative;
      min-height: 55px;
    }
    
    .header-title-container {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .header-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ff9900;
    }

    .header-text {
      font-size: 18px;
      font-weight: bold;
    }

    .cart-btn { 
      padding: 8px 12px; 
      cursor: pointer; 
      background: #ff9900; 
      color: #fff; 
      border: none; 
      border-radius: 5px; 
      font-weight: bold; 
      font-size: 14px;
      margin-left: auto;
    }

    .products-container { 
      display: grid; 
      grid-template-columns: repeat(2, 1fr); 
      gap: 12px; 
      padding: 12px; 
      max-width: 1000px;
      margin: 0 auto;
    }

    @media (min-width: 600px) {
      .products-container {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        padding: 20px;
      }
    }

    .card { 
      border: 1px solid #ddd; 
      padding: 10px; 
      border-radius: 10px; 
      text-align: center; 
      background: #fff; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.08); 
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card img { 
      width: 100%; 
      height: 120px; 
      object-fit: cover; 
      border-radius: 8px; 
      background: #eee; 
    }

    .card h3 { font-size: 15px; margin: 8px 0 4px 0; }
    .card p { font-size: 14px; margin: 0 0 8px 0; color: #333; font-weight: bold; }

    .btn { 
      background: #2e7d32; 
      color: white; 
      border: none; 
      padding: 8px 10px; 
      border-radius: 5px; 
      cursor: pointer; 
      width: 100%; 
      font-weight: bold; 
      font-size: 13px;
    }
    
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 450px; max-height: 90vh; overflow-y: auto; position: relative; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .qty-btn { background: #ddd; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 0 4px; }
    
    .checkout-section { margin-top: 15px; border-top: 2px dashed #ddd; padding-top: 15px; text-align: left; }
    .checkout-section h4 { margin-bottom: 10px; color: #1b365d; }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    .input-group input, .input-group textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    
    .payment-options { display: flex; gap: 10px; margin-bottom: 10px; }
    .payment-option { flex: 1; border: 1px solid #ccc; padding: 10px; border-radius: 6px; text-align: center; cursor: pointer; font-size: 13px; }

    .place-order-btn { 
      background: #28a745; 
      color: white; 
      border: none; 
      padding: 12px 15px; 
      border-radius: 5px; 
      cursor: pointer; 
      width: 100%; 
      margin-top: 10px; 
      font-weight: bold; 
      font-size: 16px;
    }
    .close-btn { background: #777; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 8px; }

    /* Order Confirmation Success Screen */
    .success-box {
      text-align: center;
      padding: 20px 10px;
    }
    .success-icon {
      font-size: 50px;
      color: #28a745;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-title-container">
    <img src="logo.jpg" alt="మన ఊరి మార్కెట్" class="header-logo" onerror="this.src='https://via.placeholder.com/40'">
    <span class="header-text">మన ఊరి మార్కెట్</span>
  </div>
  <button class="cart-btn" onclick="showCart()">🛒 Cart (<span id="cartCount">0</span>)</button>
</header>

<h3 style="text-align:center; margin-top:15px; margin-bottom: 5px;">మా ఉత్పత్తులు (Our Products)</h3>

<div class="products-container">
  
  <div class="card">
    <img src="https://images.unsplash.com/photo-1590080875515-8a3a8dc5735e?w=300" alt="మామిడి పచ్చడి">
    <h3>మామిడి పచ్చడి</h3>
    <p>ధర: ₹180</p>
    <button class="btn" onclick="addToCart('మామిడి పచ్చడి')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1550258987-190a2d41a8ba?w=300" alt="మామిడి తాండ్ర">
    <h3>మామిడి తాండ్ర</h3>
    <p>ధర: ₹200</p>
    <button class="btn" onclick="addToCart('మామిడి తాండ్ర')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1615485290382-441e4d049cb5?w=300" alt="స్వచ్ఛమైన పసుపు">
    <h3>స్వచ్ఛమైన పసుపు</h3>
    <p>ధర: ₹150</p>
    <button class="btn" onclick="addToCart('స్వచ్ఛమైన పసుపు')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1541781774459-bb2af2f05b55?w=300" alt="హోమ్‌మేడ్ హల్వా">
    <h3>హోమ్‌మేడ్ హల్వా</h3>
    <p>ధర: ₹220</p>
    <button class="btn" onclick="addToCart('హోమ్‌మేడ్ హల్వా')">Add to Cart</button>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1553279768-865429fa0078?w=300" alt="తాజా మామిడిపండ్లు">
    <h3>తాజా మామిడిపండ్లు</h3>
    <p>ధర: ₹120</p>
    <button class="btn" onclick="addToCart('తాజా మామిడిపండ్లు')">Add to Cart</button>
  </div>

</div>

<!-- Cart Pop-up Modal -->
<div id="cartModal" class="modal">
  <div class="modal-content" id="modalContent">
    <h3>🛒 మీ కార్ట్ (Your Cart)</h3>
    <div id="cartItems"></div>
    <h4 id="cartTotal">మొత్తం: ₹0</h4>
    
    <div class="checkout-section">
      <h4>📦 డెలివరీ వివరాలు & చెల్లింపు (Payment)</h4>
      
      <div class="input-group">
        <label>మీ పేరు (Name):</label>
        <input type="text" id="custName" placeholder="ఉదా: రాము">
      </div>

      <div class="input-group">
        <label>ఫోన్ నంబర్ (Phone Number):</label>
        <input type="tel" id="custPhone" placeholder="ఉదా: 9876543210">
      </div>

      <div class="input-group">
        <label>చిరునామా (Delivery Address):</label>
        <textarea id="custAddress" rows="2" placeholder="ఇంటి నంబర్, వీధి, ఊరి పేరు..."></textarea>
      </div>

      <div class="input-group">
        <label>చెల్లింపు పద్ధతి (Payment Method):</label>
        <div class="payment-options">
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="UPI" checked onclick="toggleUpiDetails(true)">
            📲 UPI (GPay/PhonePe)
          </label>
          <label class="payment-option">
            <input type="radio" name="paymentMethod" value="COD" onclick="toggleUpiDetails(false)">
            💵 Cash on Delivery
          </label>
        </div>
      </div>

      <div class="input-group" id="upiDetailGroup">
        <label>మీ UPI ID / Google Pay / PhonePe నంబర్:</label>
        <input type="text" id="custUpi" placeholder="ఉదా: example@upi లేదా 9876543210">
      </div>

      <button class="place-order-btn" onclick="submitOrder()">
        ✅ ఆర్డర్ కన్ఫర్మ్ చేయండి
      </button>
    </div>

    <button class="close-btn" onclick="closeCart()">Close</button>
  </div>
</div>

<script>
  const myPhoneNumber = "918688347212"; 

  const prices = {
    "మామిడి పచ్చడి": 180,
    "మామిడి తాండ్ర": 200,
    "స్వచ్ఛమైన పసుపు": 150,
    "హోమ్‌మేడ్ హల్వా": 220,
    "తాజా మామిడిపండ్లు": 120
  };
  
  let cart = [];

  function addToCart(product) {
    let item = cart.find(i => i.name === product);
    if (item) {
      item.qty += 1;
    } else {
      cart.push({ name: product, price: prices[product], qty: 1 });
    }
    updateCart();
  }

  function changeQty(index, change) {
    cart[index].qty += change;
    if (cart[index].qty <= 0) {
      cart.splice(index, 1);
    }
    updateCart();
    renderCartModal();
  }

  function updateCart() {
    let totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
    document.getElementById('cartCount').textContent = totalCount;
  }

  function showCart() {
    resetModalContent();
    renderCartModal();
    document.getElementById('cartModal').style.display = 'flex';
  }

  function closeCart() {
    document.getElementById('cartModal').style.display = 'none';
  }

  function toggleUpiDetails(show) {
    document.getElementById('upiDetailGroup').style.display = show ? 'block' : 'none';
  }

  function renderCartModal() {
    let container = document.getElementById('cartItems');
    if (!container) return;
    
    if (cart.length === 0) {
      container.innerHTML = "<p>కార్ట్ ఖాళీగా ఉంది!</p>";
      document.getElementById('cartTotal').textContent = "మొత్తం: ₹0";
      return;
    }
    
    let html = "";
    let grandTotal = 0;

    cart.forEach((item, index) => {
      let total = item.price * item.qty;
      grandTotal += total;
      html += `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong><br>
            <small>₹${item.price} x ${item.qty} = ₹${total}</small>
          </div>
          <div>
            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;
    document.getElementById('cartTotal').textContent = `మొత్తం: ₹${grandTotal}`;
  }

  function resetModalContent() {
    document.getElementById('modalContent').innerHTML = `
      <h3>🛒 మీ కార్ట్ (Your Cart)</h3>
      <div id="cartItems"></div>
      <h4 id="cartTotal">మొత్తం: ₹0</h4>
      
      <div class="checkout-section">
        <h4>📦 డెలివరీ వివరాలు & చెల్లింపు (Payment)</h4>
        
        <div class="input-group">
          <label>మీ పేరు (Name):</label>
          <input type="text" id="custName" placeholder="ఉదా: రాము">
        </div>

        <div class="input-group">
          <label>ఫోన్ నంబర్ (Phone Number):</label>
          <input type="tel" id="custPhone" placeholder="ఉదా: 9876543210">
        </div>

        <div class="input-group">
          <label>చిరునామా (Delivery Address):</label>
          <textarea id="custAddress" rows="2" placeholder="ఇంటి నంబర్, వీధి, ఊరి పేరు..."></textarea>
        </div>

        <div class="input-group">
          <label>చెల్లింపు పద్ధతి (Payment Method):</label>
          <div class="payment-options">
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="UPI" checked onclick="toggleUpiDetails(true)">
              📲 UPI (GPay/PhonePe)
            </label>
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="COD" onclick="toggleUpiDetails(false)">
              💵 Cash on Delivery
            </label>
          </div>
        </div>

        <div class="input-group" id="upiDetailGroup">
          <label>మీ UPI ID / Google Pay / PhonePe నంబర్:</label>
          <input type="text" id="custUpi" placeholder="ఉదా: example@upi లేదా 9876543210">
        </div>

        <button class="place-order-btn" onclick="submitOrder()">
          ✅ ఆర్డర్ కన్ఫర్మ్ చేయండి
        </button>
      </div>

      <button class="close-btn" onclick="closeCart()">Close</button>
    `;
  }

  function submitOrder() {
    if (cart.length === 0) {
      alert("మీ కార్ట్ ఖాళీగా ఉంది! దయచేసి ఐటమ్స్ యాడ్ చేయండి.");
      return;
    }

    let name = document.getElementById('custName').value.trim();
    let phone = document.getElementById('custPhone').value.trim();
    let address = document.getElementById('custAddress').value.trim();
    let paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
    let upiId = document.getElementById('custUpi').value.trim();

    if (!name || !phone || !address) {
      alert("దయచేసి మీ పేరు, ఫోన్ నంబర్ మరియు చిరునామా నమోదు చేయండి.");
      return;
    }

    if (paymentMethod === "UPI" && !upiId) {
      alert("దయచేసి మీ UPI ID లేదా PhonePe/GPay నంబర్ తెలియజేయండి.");
      return;
    }

    let message = "*🛍️ కొత్త ఆర్డర్ వివరాలు - మన ఊరి మార్కెట్*\n\n";
    message += `👤 *పేరు:* ${name}\n`;
    message += `📞 *ఫోన్ నంబర్:* ${phone}\n`;
    message += `🏠 *చిరునామా:* ${address}\n`;
    message += `💳 *చెల్లింపు పద్ధతి:* ${paymentMethod}`;
    if(paymentMethod === "UPI") {
      message += ` (${upiId})`;
    }
    message += `\n\n*ఆర్డర్ చేసిన వస్తువులు:*\n`;

    let grandTotal = 0;
    cart.forEach((item, index) => {
      let total = item.price * item.qty;
      grandTotal += total;
      message += `${index + 1}. ${item.name} - ${item.qty} Qty (₹${total})\n`;
    });

    message += `\n💰 *మొత్తం బిల్లు:* ₹${grandTotal}\n\nదయచేసి ఈ ఆర్డర్ కన్ఫర్మ్ చేయగలరు.`;

    let whatsappUrl = `https://wa.me/${myPhoneNumber}?text=${encodeURIComponent(message)}`;
    window.open(whatsappUrl, '_blank');

    // Show Order Confirmation Screen inside Modal
    document.getElementById('modalContent').innerHTML = `
      <div class="success-box">
        <div class="success-icon">🎉</div>
        <h2 style="color: #28a745; margin-bottom: 5px;">మీ ఆర్డర్ కన్ఫర్మ్ అయ్యింది!</h2>
        <p style="color: #555; font-size: 14px;">మీ ఆర్డర్ వివరాలు వాట్సాప్‌కి పంపించబడ్డాయి. మేము త్వరలోనే మిమ్మల్ని సంప్రదిస్తాము.</p>
        <button class="place-order-btn" style="background: #1b365d;" onclick="closeCart()">ఓకే (OK)</button>
      </div>
    `;

    // Clear Cart
    cart = [];
    updateCart();
  }
</script>

</body>
</html>
